<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartu Tanda Siswa IX I</title>
  <style>
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #3b82f6;
      --card-width: 320px;
      --card-height: 500px;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      max-width: 1200px;
    }

    /* Container Kartu (Mendukung Flip Efek 3D) */
    .card-wrapper {
      width: var(--card-width);
      height: var(--card-height);
      perspective: 1000px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border-radius: 16px;
    }

    /* Hover atau class active untuk membalik kartu */
    .card-wrapper:hover .card-inner,
    .card-wrapper.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 16px;
      overflow: hidden;
      background: white;
      box-sizing: border-box;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
    }

    /* --- BAGIAN DEPAN --- */
    .card-front {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      padding: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .header-front {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 10px;
    }

    .header-front img {
      width: 60px;
      height: auto;
      margin-bottom: 6px;
    }

    .header-front h2 {
      margin: 0;
      font-size: 16px;
      color: var(--primary-color);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .header-front h3 {
      margin: 2px 0 0 0;
      font-size: 13px;
      color: #64748b;
      font-weight: 600;
    }

    .photo-box {
      width: 130px;
      height: 160px;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid var(--secondary-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin: 15px 0;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info-front {
      width: 100%;
      margin-bottom: 10px;
    }

    .info-front .student-name {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      text-transform: uppercase;
      margin: 0 0 5px 0;
      line-height: 1.2;
    }

    .info-front .student-nisn {
      font-size: 13px;
      color: #475569;
      font-weight: 600;
      background: #e0f2fe;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .footer-hint {
      font-size: 10px;
      color: #94a3b8;
      margin-top: auto;
    }

    /* --- BAGIAN BELAKANG --- */
    .card-back {
      transform: rotateY(180deg);
      background: white;
      padding: 20px;
      text-align: left;
    }

    .header-back {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
      margin-bottom: 15px;
      text-align: center;
      text-transform: uppercase;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .detail-table tr {
      border-bottom: 1px solid #f1f5f9;
    }

    .detail-table td {
      padding: 6px 2px;
      vertical-align: top;
    }

    .detail-table td.label {
      font-weight: 600;
      color: #475569;
      width: 32%;
    }

    .detail-table td.colon {
      width: 3%;
      color: #94a3b8;
    }

    .detail-table td.value {
      color: #0f172a;
      font-weight: 500;
      width: 65%;
    }

    /* Status Message Container */
    #status-container {
      text-align: center;
      margin-top: 50px;
      font-size: 18px;
      color: #475569;
    }
  </style>
</head>
<body>

  <div id="status-container">Memuat Kartu Siswa...</div>
  <div id="cards-wrapper" class="container"></div>

  <script>
    // URL Web App Google Apps Script Anda
    const API_URL = 'https://script.google.com/macros/s/AKfycbweHaAg7Juv6HnjligTyD7k3d6vJEIvcB5BwVn-2FnRv4Tn_mfV_2kIIuZjEwZsOnXyAg/exec?action=getKts'; // Ganti URL ini sesuai deployment Anda

    async function loadCards() {
      const statusDiv = document.getElementById('status-container');
      const cardsWrapper = document.getElementById('cards-wrapper');

      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0) {
          statusDiv.innerHTML = 'Data siswa tidak ditemukan.';
          return;
        }

        statusDiv.style.display = 'none'; // Sembunyikan pesan loading
        cardsWrapper.innerHTML = '';

        data.forEach(siswa => {
          // Hanya jika status tidak "tolak"
          if (String(siswa.statusValidation || '').toLowerCase().trim() === 'tolak') {
            return;
          }

          const cardHTML = `
            <div class="card-wrapper" onclick="this.classList.toggle('flipped')">
              <div class="card-inner">
                
                <!-- TAMPILAN DEPAN -->
                <div class="card-front">
                  <div class="header-front">
                    <img src="https://apxid.github.io/kelas9i/assets/9i.png" alt="Logo 9I" onerror="this.src='https://via.placeholder.com/60'">
                    <h2>SMP NEGERI 1 MOGA</h2>
                    <h3>KELAS IX I</h3>
                  </div>

                  <div class="photo-box">
                    <img src="${siswa.foto || 'https://via.placeholder.com/130x160'}" alt="Foto ${siswa.nama}">
                  </div>

                  <div class="info-front">
                    <div class="student-name">${siswa.nama || '-'}</div>
                    <div class="student-nisn">NISN: ${siswa.nisn || '-'}</div>
                  </div>

                  <div class="footer-hint">* Klik / Sentuh kartu untuk membalik</div>
                </div>

                <!-- TAMPILAN BELAKANG -->
                <div class="card-back">
                  <div class="header-back">BIODATA SISWA</div>
                  <table class="detail-table">
                    <tr>
                      <td class="label">No Absen</td>
                      <td class="colon">:</td>
                      <td class="value">${siswa.absen || '-'}</td>
                    </tr>
                    <tr>
                      <td class="label">NISN</td>
                      <td class="colon">:</td>
                      <td class="value">${siswa.nisn || '-'}</td>
                    </tr>
                    <tr>
                      <td class="label">Nama Lengkap</td>
                      <td class="colon">:</td>
                      <td class="value">${siswa.nama || '-'}</td>
                    </tr>
                    <tr>
                      <td class="label">Jenis Kelamin</td>
                      <td class="colon">:</td>
                      <td class="value">${siswa.jk || '-'}</td>
                    </tr>
                    <tr>
                      <td class="label">Tempat Lahir</td>
                      <td class="colon">:</td>
                      <td class="value">${siswa.tempatLahir || '-'}</td>
                    </tr>
                    <tr>
                      <td class="label">Tanggal Lahir</td>
                      <td class="colon">:</td>
                      <td class="value">${siswa.tglLahir || '-'}</td>
                    </tr>
                    <tr>
                      <td class="label">Alamat</td>
                      <td class="colon">:</td>
                      <td class="value">${siswa.alamat || '-'}</td>
                    </tr>
                    <tr>
                      <td class="label">Hobi</td>
                      <td class="colon">:</td>
                      <td class="value">${siswa.hobi || '-'}</td>
                    </tr>
                    <tr>
                      <td class="label">Cita-cita</td>
                      <td class="colon">:</td>
                      <td class="value">${siswa.cita || '-'}</td>
                    </tr>
                  </table>
                </div>

              </div>
            </div>
          `;
          cardsWrapper.innerHTML += cardHTML;
        });

      } catch (error) {
        console.error("Error loading cards:", error);
        statusDiv.innerHTML = '❌ Gagal memuat data kartu siswa.';
      }
    }

    // Jalankan saat halaman dibuka
    document.addEventListener('DOMContentLoaded', loadCards);
  </script>

</body>
</html>
