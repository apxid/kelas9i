<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak KTS IX I</title>

  <!-- Library untuk Unduh Gambar & PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Library JsBarcode untuk Render Barcode -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>

  <style>
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #3b82f6;
      --osis-yellow: #f59e0b;
      --smp-blue: #0284c7;
      --card-width: 320px;
      --card-height: 520px;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Form Pencarian NISN */
    .search-box {
      background: white;
      padding: 20px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-box input {
      padding: 10px 15px;
      font-size: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      width: 220px;
    }

    .btn {
      padding: 10px 18px;
      font-size: 14px;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-primary { background-color: var(--primary-color); }
    .btn-primary:hover { background-color: var(--secondary-color); }

    .btn-side { background-color: #475569; }
    .btn-side.active { background-color: #0284c7; }

    .btn-download { background-color: #16a34a; }
    .btn-download:hover { background-color: #15803d; }

    /* Control Panel */
    .controls-panel {
      display: none;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .container {
      display: flex;
      justify-content: center;
    }

    /* Wrapper Kartu Tampilan Utama */
    .card-wrapper {
      width: var(--card-width);
      height: var(--card-height);
    }

    .card-container {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: white;
      box-sizing: border-box;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* --- BAGIAN DEPAN --- */
    .card-front {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      padding: 20px 20px 0 20px;
      align-items: center;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header-front {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
      z-index: 2;
    }

    .header-front img {
      width: 50px;
      height: auto;
      margin-bottom: 4px;
    }

    .header-front h2 {
      margin: 0;
      font-size: 15px;
      color: var(--primary-color);
      font-weight: 800;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .header-front h3 {
      margin: 2px 0 0 0;
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
      text-align: center;
    }

    /* Penurunan foto, nama, dan NISN sebanyak 4 baris (~55px) */
    .photo-box {
      width: 110px;
      height: 140px;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid var(--secondary-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      margin-top: 55px; 
      margin-bottom: 10px;
      z-index: 2;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info-front {
      width: 100%;
      text-align: center;
      z-index: 2;
    }

    .info-front .student-name {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      text-transform: uppercase;
      margin: 0 0 4px 0;
      line-height: 1.2;
    }

    .info-front .student-nisn {
      font-size: 11px;
      color: #475569;
      font-weight: 600;
      background: #e0f2fe;
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 4px;
    }

    /* Container Barcode & Wave Bawah */
    .bottom-section {
      margin-top: auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-bottom: 8px;
    }

    .barcode-container {
      z-index: 3;
      background: white;
      padding: 3px 8px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      margin-bottom: 6px;
    }

    .barcode-container svg {
      max-width: 210px;
      height: 36px;
      display: block;
    }

    /* SVG Wave Modern & Simpel di Bagian Paling Bawah */
    .bottom-wave-decoration {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      z-index: 1;
      pointer-events: none;
    }

    /* --- BAGIAN BELAKANG --- */
    .card-back {
      background: white;
      padding: 20px;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .header-back {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 6px;
      margin-top: 10px;
      margin-bottom: 12px;
      text-align: center;
      text-transform: uppercase;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5px;
    }

    .detail-table tr {
      border-bottom: 1px solid #f1f5f9;
    }

    .detail-table td {
      padding: 4px 2px;
      vertical-align: top;
    }

    .detail-table td.label {
      font-weight: 600;
      color: #475569;
      width: 32%;
    }

    .detail-table td.colon {
      width: 3%;
      color: #94a3b8;
    }

    .detail-table td.value {
      color: #0f172a;
      font-weight: 500;
      width: 65%;
    }

    .teacher-signature-wrapper {
      margin-top: auto;
      margin-bottom: 15px;
      display: flex;
      justify-content: flex-end;
      width: 100%;
    }

    .teacher-signature-box {
      text-align: left;
      font-size: 10px;
      color: #1e293b;
      width: 180px;
    }

    .teacher-signature-box .title {
      font-weight: 600;
      margin-bottom: 30px;
    }

    .teacher-signature-box .name {
      font-weight: 700;
      text-decoration: underline;
    }

    .teacher-signature-box .nip {
      color: #64748b;
      font-size: 9.5px;
    }

    #status-container {
      text-align: center;
      font-size: 15px;
      color: #475569;
      margin-top: 10px;
    }

    #hidden-render-container {
      position: absolute;
      top: -9999px;
      left: -9999px;
      display: flex;
      gap: 20px;
    }
  </style>
</head>
<body>

  <!-- Input Form Pencarian NISN -->
  <div class="search-box">
    <input type="text" id="input-nisn" placeholder="Masukkan NISN Siswa..." onkeypress="if(event.key==='Enter') cariSiswa()">
    <button class="btn btn-primary" onclick="cariSiswa()">Cari KTS</button>
  </div>

  <!-- Panel Tombol Navigasi Sisi & Download -->
  <div id="controls-panel" class="controls-panel">
    <button id="btn-front" class="btn btn-side active" onclick="switchSide('front')">Sisi Depan</button>
    <button id="btn-back" class="btn btn-side" onclick="switchSide('back')">Sisi Belakang</button>
    <button class="btn btn-download" onclick="downloadAllPNG()">📥 Unduh PNG (Depan & Belakang)</button>
    <button class="btn btn-download" style="background-color: #dc2626;" onclick="downloadPDF_A4()">📄 Unduh PDF A4</button>
  </div>

  <div id="status-container">Masukkan NISN siswa di atas untuk melihat KTS.</div>
  
  <!-- Container Tampilan Utama -->
  <div id="cards-wrapper" class="container"></div>

  <!-- Hidden Container (Digunakan untuk proses rendering ekspor) -->
  <div id="hidden-render-container"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbweHaAg7Juv6HnjligTyD7k3d6vJEIvcB5BwVn-2FnRv4Tn_mfV_2kIIuZjEwZsOnXyAg/exec?action=getKts';

    let allStudentsData = [];
    let currentSiswa = null;
    let currentSide = 'front';

    async function initData() {
      const statusDiv = document.getElementById('status-container');
      try {
        statusDiv.innerHTML = 'Memuat database siswa...';
        const response = await fetch(API_URL);
        allStudentsData = await response.json();
        
        statusDiv.innerHTML = 'Silakan masukkan NISN untuk menampilkan Kartu KTS.';
        
        const urlParams = new URLSearchParams(window.location.search);
        const nisnParam = urlParams.get('nisn');
        if (nisnParam) {
          document.getElementById('input-nisn').value = nisnParam;
          cariSiswa();
        }
      } catch (error) {
        console.error("Error:", error);
        statusDiv.innerHTML = '❌ Gagal memuat data siswa.';
      }
    }

    function cariSiswa() {
      const inputNisn = document.getElementById('input-nisn').value.trim();
      const statusDiv = document.getElementById('status-container');
      const cardsWrapper = document.getElementById('cards-wrapper');
      const controlsPanel = document.getElementById('controls-panel');

      cardsWrapper.innerHTML = '';

      if (!inputNisn) {
        statusDiv.innerHTML = '⚠️ Harap masukkan NISN terlebih dahulu.';
        controlsPanel.style.display = 'none';
        return;
      }

      currentSiswa = allStudentsData.find(s => String(s.nisn).trim() === inputNisn);

      if (!currentSiswa) {
        statusDiv.innerHTML = `❌ Data siswa dengan NISN <b>${inputNisn}</b> tidak ditemukan.`;
        controlsPanel.style.display = 'none';
        return;
      }

      statusDiv.innerHTML = '';
      controlsPanel.style.display = 'flex';
      currentSide = 'front';
      renderCard();
    }

    function switchSide(side) {
      currentSide = side;
      document.getElementById('btn-front').classList.toggle('active', side === 'front');
      document.getElementById('btn-back').classList.toggle('active', side === 'back');
      renderCard();
    }

    // Helper Template Sisi Depan
    function getFrontHTML(siswa, prefix = '') {
      const barcodeId = `${prefix}barcode-${siswa.nisn || '00000'}`;
      return `
        <div class="card-container">
          <div class="card-front">
            <div class="header-front">
              <img src="https://apxid.github.io/kelas9i/assets/9i.png" alt="Logo 9I" crossorigin="anonymous" onerror="this.src='https://via.placeholder.com/50'">
              <h2>SMP NEGERI 1 MOGA</h2>
              <h3>KELAS IX I</h3>
            </div>

            <div class="photo-box">
              <img src="${siswa.foto || 'https://via.placeholder.com/110x140'}" crossorigin="anonymous" alt="Foto ${siswa.nama}">
            </div>

            <div class="info-front">
              <div class="student-name">${siswa.nama || '-'}</div>
              <div class="student-nisn">NISN: ${siswa.nisn || '-'}</div>
            </div>

            <!-- Bottom Section -->
            <div class="bottom-section">
              <div class="barcode-container">
                <svg id="${barcodeId}"></svg>
              </div>

              <!-- Line Wave Refined (Kuning OSIS & Biru SMP) -->
              <svg class="bottom-wave-decoration" viewBox="0 0 320 60" preserveAspectRatio="none">
                <path d="M0 25 Q160 55 320 15 L320 60 L0 60 Z" fill="#f59e0b" opacity="0.85"/>
                <path d="M0 35 Q160 10 320 30 L320 60 L0 60 Z" fill="#0284c7" opacity="0.95"/>
                <path d="M0 35 Q160 10 320 30" fill="none" stroke="#fef08a" stroke-width="1.5"/>
              </svg>
            </div>
          </div>
        </div>
      `;
    }

    // Helper Template Sisi Belakang
    function getBackHTML(siswa) {
      return `
        <div class="card-container">
          <div class="card-back">
            <div class="header-back">BIODATA SISWA</div>
            <table class="detail-table">
              <tr><td class="label">No Absen</td><td class="colon">:</td><td class="value">${siswa.absen || '-'}</td></tr>
              <tr><td class="label">NISN</td><td class="colon">:</td><td class="value">${siswa.nisn || '-'}</td></tr>
              <tr><td class="label">Nama Lengkap</td><td class="colon">:</td><td class="value">${siswa.nama || '-'}</td></tr>
              <tr><td class="label">Jenis Kelamin</td><td class="colon">:</td><td class="value">${siswa.jk || '-'}</td></tr>
              <tr><td class="label">Tempat Lahir</td><td class="colon">:</td><td class="value">${siswa.tempatLahir || '-'}</td></tr>
              <tr><td class="label">Tanggal Lahir</td><td class="colon">:</td><td class="value">${siswa.tglLahir || '-'}</td></tr>
              <tr><td class="label">Alamat</td><td class="colon">:</td><td class="value">${siswa.alamat || '-'}</td></tr>
              <tr><td class="label">Hobi</td><td class="colon">:</td><td class="value">${siswa.hobi || '-'}</td></tr>
              <tr><td class="label">Cita-cita</td><td class="colon">:</td><td class="value">${siswa.cita || '-'}</td></tr>
            </table>

            <div class="teacher-signature-wrapper">
              <div class="teacher-signature-box">
                <div class="title">Wali Kelas 9I</div>
                <div class="name">YANUAR BAYU TRIYONO, S.I.Pust.</div>
                <div class="nip">NIP 198601272024211008</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function generateBarcode(elementId, value) {
      if (!value) return;
      try {
        JsBarcode(`#${elementId}`, String(value), {
          format: "CODE128",
          width: 1.4,
          height: 30,
          displayValue: false,
          margin: 0
        });
      } catch (e) {
        console.error("Gagal membuat barcode:", e);
      }
    }

    function renderCard() {
      const cardsWrapper = document.getElementById('cards-wrapper');
      if (!currentSiswa) return;

      cardsWrapper.innerHTML = `
        <div class="card-wrapper">
          ${currentSide === 'front' ? getFrontHTML(currentSiswa, 'main-') : getBackHTML(currentSiswa)}
        </div>
      `;

      if (currentSide === 'front') {
        generateBarcode(`main-barcode-${currentSiswa.nisn || '00000'}`, currentSiswa.nisn);
      }
    }

    function prepareExportElements() {
      const container = document.getElementById('hidden-render-container');
      container.innerHTML = `
        <div id="export-front" class="card-wrapper">${getFrontHTML(currentSiswa, 'exp-')}</div>
        <div id="export-back" class="card-wrapper">${getBackHTML(currentSiswa)}</div>
      `;
      generateBarcode(`exp-barcode-${currentSiswa.nisn || '00000'}`, currentSiswa.nisn);
    }

    async function downloadAllPNG() {
      if (!currentSiswa) return;
      prepareExportElements();

      const frontElem = document.getElementById('export-front');
      const backElem = document.getElementById('export-back');

      const canvasFront = await html2canvas(frontElem, { useCORS: true, scale: 2 });
      const linkFront = document.createElement('a');
      linkFront.href = canvasFront.toDataURL("image/png");
      linkFront.download = `KTS_${currentSiswa.nisn}_DEPAN.png`;
      linkFront.click();

      setTimeout(async () => {
        const canvasBack = await html2canvas(backElem, { useCORS: true, scale: 2 });
        const linkBack = document.createElement('a');
        linkBack.href = canvasBack.toDataURL("image/png");
        linkBack.download = `KTS_${currentSiswa.nisn}_BELAKANG.png`;
        linkBack.click();
      }, 500);
    }

    async function downloadPDF_A4() {
      if (!currentSiswa) return;
      prepareExportElements();

      const frontElem = document.getElementById('export-front');
      const backElem = document.getElementById('export-back');

      const canvasFront = await html2canvas(frontElem, { useCORS: true, scale: 2 });
      const canvasBack = await html2canvas(backElem, { useCORS: true, scale: 2 });

      const imgFront = canvasFront.toDataURL('image/png');
      const imgBack = canvasBack.toDataURL('image/png');

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });

      const cardWidth = 85;
      const cardHeight = 138;
      const posY = 30;

      pdf.addImage(imgFront, 'PNG', 15, posY, cardWidth, cardHeight);
      pdf.addImage(imgBack, 'PNG', 110, posY, cardWidth, cardHeight);

      pdf.save(`KTS_${currentSiswa.nisn}_A4.pdf`);
    }

    document.addEventListener('DOMContentLoaded', initData);
  </script>

</body>
</html>
