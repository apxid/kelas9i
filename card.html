<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak KTS IX I</title>
  <style>
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #3b82f6;
      --card-width: 320px;
      --card-height: 520px;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Container Form Pencarian NISN */
    .search-box {
      background: white;
      padding: 20px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 25px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-box input {
      padding: 10px 15px;
      font-size: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      width: 220px;
    }

    .search-box button {
      padding: 10px 20px;
      font-size: 15px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .search-box button:hover {
      background-color: var(--secondary-color);
    }

    .container {
      display: flex;
      justify-content: center;
    }

    /* Container Kartu (Mendukung Flip Efek 3D) */
    .card-wrapper {
      width: var(--card-width);
      height: var(--card-height);
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border-radius: 16px;
    }

    .card-wrapper:hover .card-inner,
    .card-wrapper.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 16px;
      overflow: hidden;
      background: white;
      box-sizing: border-box;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
    }

    /* --- BAGIAN DEPAN --- */
    .card-front {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      padding: 20px;
      align-items: center;
    }

    .header-front {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 8px;
    }

    .header-front img {
      width: 55px;
      height: auto;
      margin-bottom: 4px;
    }

    .header-front h2 {
      margin: 0;
      font-size: 15px;
      color: var(--primary-color);
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .header-front h3 {
      margin: 2px 0 0 0;
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
    }

    /* Foto, nama, dan NISN diturunkan 3 baris lagi (margin-top: 60px) */
    .photo-box {
      width: 120px;
      height: 150px;
      border-radius: 12px;
      overflow: hidden;
      border: 3px solid var(--secondary-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-top: 60px; /* Diturunkan 3 baris lagi */
      margin-bottom: 12px;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info-front {
      width: 100%;
      margin-bottom: 10px;
    }

    .info-front .student-name {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      text-transform: uppercase;
      margin: 0 0 6px 0;
      line-height: 1.2;
    }

    .info-front .student-nisn {
      font-size: 12px;
      color: #475569;
      font-weight: 600;
      background: #e0f2fe;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .footer-hint {
      font-size: 10px;
      color: #94a3b8;
      margin-top: auto;
    }

    /* --- BAGIAN BELAKANG --- */
    .card-back {
      transform: rotateY(180deg);
      background: white;
      padding: 20px;
      text-align: left;
    }

    /* Teks Biodata diturunkan 1 baris (margin-top: 20px) */
    .header-back {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 6px;
      margin-top: 20px; /* Turun 1 baris */
      margin-bottom: 12px;
      text-align: center;
      text-transform: uppercase;
    }

    .detail-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5px;
    }

    .detail-table tr {
      border-bottom: 1px solid #f1f5f9;
    }

    .detail-table td {
      padding: 4px 2px;
      vertical-align: top;
    }

    .detail-table td.label {
      font-weight: 600;
      color: #475569;
      width: 32%;
    }

    .detail-table td.colon {
      width: 3%;
      color: #94a3b8;
    }

    .detail-table td.value {
      color: #0f172a;
      font-weight: 500;
      width: 65%;
    }

    /* Bagian Wali Kelas */
    .teacher-signature {
      margin-top: auto;
      text-align: right;
      font-size: 10px;
      color: #1e293b;
      padding-top: 10px;
    }

    .teacher-signature .title {
      font-weight: 600;
      margin-bottom: 35px; /* Space untuk tanda tangan */
    }

    .teacher-signature .name {
      font-weight: 700;
      text-decoration: underline;
    }

    .teacher-signature .nip {
      color: #64748b;
      font-size: 9.5px;
    }

    #status-container {
      text-align: center;
      font-size: 15px;
      color: #475569;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Input Form Pencarian NISN -->
  <div class="search-box">
    <input type="text" id="input-nisn" placeholder="Masukkan NISN Siswa..." onkeypress="if(event.key==='Enter') cariSiswa()">
    <button onclick="cariSiswa()">Cari KTS</button>
  </div>

  <div id="status-container">Masukkan NISN siswa di atas untuk melihat KTS.</div>
  <div id="cards-wrapper" class="container"></div>

  <script>
    // URL Web App Google Apps Script Anda
    const API_URL = 'https://script.google.com/macros/s/AKfycbweHaAg7Juv6HnjligTyD7k3d6vJEIvcB5BwVn-2FnRv4Tn_mfV_2kIIuZjEwZsOnXyAg/exec?action=getKts'; // Masukkan URL Web App Anda

    let allStudentsData = [];

    // Ambil data saat halaman dibuka
    async function initData() {
      const statusDiv = document.getElementById('status-container');
      try {
        statusDiv.innerHTML = 'Memuat database siswa...';
        const response = await fetch(API_URL);
        allStudentsData = await response.json();
        
        statusDiv.innerHTML = 'Silakan masukkan NISN untuk menampilkan Kartu KTS.';
        
        // Cek jika ada NISN di parameter URL (misal: ?nisn=0105695063)
        const urlParams = new URLSearchParams(window.location.search);
        const nisnParam = urlParams.get('nisn');
        if (nisnParam) {
          document.getElementById('input-nisn').value = nisnParam;
          cariSiswa();
        }

      } catch (error) {
        console.error("Error:", error);
        statusDiv.innerHTML = '❌ Gagal memuat data siswa.';
      }
    }

    function cariSiswa() {
      const inputNisn = document.getElementById('input-nisn').value.trim();
      const statusDiv = document.getElementById('status-container');
      const cardsWrapper = document.getElementById('cards-wrapper');

      cardsWrapper.innerHTML = '';

      if (!inputNisn) {
        statusDiv.innerHTML = '⚠️ Harap masukkan NISN terlebih dahulu.';
        return;
      }

      // Cari siswa yang cocok berdasarkan NISN
      const siswa = allStudentsData.find(s => String(s.nisn).trim() === inputNisn);

      if (!siswa) {
        statusDiv.innerHTML = `❌ Data siswa dengan NISN <b>${inputNisn}</b> tidak ditemukan.`;
        return;
      }

      statusDiv.innerHTML = ''; // Hapus pesan jika data ditemukan

      const cardHTML = `
        <div class="card-wrapper" onclick="this.classList.toggle('flipped')">
          <div class="card-inner">
            
            <!-- TAMPILAN DEPAN -->
            <div class="card-front">
              <div class="header-front">
                <img src="https://apxid.github.io/kelas9i/assets/9i.png" alt="Logo 9I" onerror="this.src='https://via.placeholder.com/55'">
                <h2>SMP NEGERI 1 MOGA</h2>
                <h3>KELAS IX I</h3>
              </div>

              <!-- Foto, Nama, NISN Diturunkan kebawah -->
              <div class="photo-box">
                <img src="${siswa.foto || 'https://via.placeholder.com/120x150'}" alt="Foto ${siswa.nama}">
              </div>

              <div class="info-front">
                <div class="student-name">${siswa.nama || '-'}</div>
                <div class="student-nisn">NISN: ${siswa.nisn || '-'}</div>
              </div>

              <div class="footer-hint">* Klik / Sentuh kartu untuk membalik</div>
            </div>

            <!-- TAMPILAN BELAKANG -->
            <div class="card-back">
              <div class="header-back">BIODATA SISWA</div>
              <table class="detail-table">
                <tr>
                  <td class="label">No Absen</td>
                  <td class="colon">:</td>
                  <td class="value">${siswa.absen || '-'}</td>
                </tr>
                <tr>
                  <td class="label">NISN</td>
                  <td class="colon">:</td>
                  <td class="value">${siswa.nisn || '-'}</td>
                </tr>
                <tr>
                  <td class="label">Nama Lengkap</td>
                  <td class="colon">:</td>
                  <td class="value">${siswa.nama || '-'}</td>
                </tr>
                <tr>
                  <td class="label">Jenis Kelamin</td>
                  <td class="colon">:</td>
                  <td class="value">${siswa.jk || '-'}</td>
                </tr>
                <tr>
                  <td class="label">Tempat Lahir</td>
                  <td class="colon">:</td>
                  <td class="value">${siswa.tempatLahir || '-'}</td>
                </tr>
                <tr>
                  <td class="label">Tanggal Lahir</td>
                  <td class="colon">:</td>
                  <td class="value">${siswa.tglLahir || '-'}</td>
                </tr>
                <tr>
                  <td class="label">Alamat</td>
                  <td class="colon">:</td>
                  <td class="value">${siswa.alamat || '-'}</td>
                </tr>
                <tr>
                  <td class="label">Hobi</td>
                  <td class="colon">:</td>
                  <td class="value">${siswa.hobi || '-'}</td>
                </tr>
                <tr>
                  <td class="label">Cita-cita</td>
                  <td class="colon">:</td>
                  <td class="value">${siswa.cita || '-'}</td>
                </tr>
              </table>

              <!-- Bagian Wali Kelas -->
              <div class="teacher-signature">
                <div class="title">Wali Kelas 9I</div>
                <div class="name">YANUAR BAYU TRIYONO, S.I.Pust.</div>
                <div class="nip">NIP 198601272024211008</div>
              </div>

            </div>

          </div>
        </div>
      `;

      cardsWrapper.innerHTML = cardHTML;
    }

    document.addEventListener('DOMContentLoaded', initData);
  </script>

</body>
</html>
