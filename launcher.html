<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Launcher Menu</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1e293b;
    }

    .demo-info {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- Konten Halaman Utama -->
  <div class="demo-info">
    <h2>Floating Launcher Menu</h2>
    <p>Lihat di sebelah kanan bawah layar untuk membuka shortcut launcher.</p>
  </div>

  <!-- Skrip Widget Floating Launcher -->
  <script>
    (function() {
      // 1. Injeksi CSS Widget ke dalam <head>
      const style = document.createElement('style');
      style.innerHTML = `
        :root {
          --launcher-primary: #2563eb;
          --launcher-bg: #ffffff;
          --launcher-text: #1e293b;
          --launcher-shadow: 0 10px 25px -5px rgba(0,0,0,0.15), 0 8px 10px -6px rgba(0,0,0,0.1);
          --launcher-shadow-hover: 0 20px 30px -5px rgba(37, 99, 235, 0.4), 0 8px 10px -6px rgba(0,0,0,0.1);
          --launcher-speed: 0.4s;
          --launcher-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Keyframes Animasi Roket Bersiap Meluncur */
        @keyframes rocketShake {
          0% { transform: scale(1.08) translate(0, 0) rotate(0deg); }
          20% { transform: scale(1.08) translate(-1px, -2px) rotate(-1deg); }
          40% { transform: scale(1.08) translate(2px, -1px) rotate(1deg); }
          60% { transform: scale(1.08) translate(-1px, 1px) rotate(-1deg); }
          80% { transform: scale(1.08) translate(1px, -2px) rotate(1deg); }
          100% { transform: scale(1.08) translate(0, -3px) rotate(0deg); }
        }

        @keyframes rocketThrust {
          0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6), 0 10px 25px -5px rgba(0,0,0,0.15); }
          50% { box-shadow: 0 15px 25px 8px rgba(249, 115, 22, 0.5), var(--launcher-shadow-hover); }
          100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6), 0 10px 25px -5px rgba(0,0,0,0.15); }
        }

        /* Container Utama Widget */
        #floating-launcher-container {
          position: fixed !important;
          top: 60% !important;
          right: 25px !important;
          transform: translateY(-50%) !important;
          z-index: 999999 !important;
          display: flex !important;
          justify-content: center !important;
          align-items: center !important;
          font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif !important;
        }

        /* Tombol Utama (Bentuk Rounded Card agar Gambar Utuh) */
        #floating-launcher-container .launcher-toggle {
          width: 68px !important;
          height: 68px !important;
          border-radius: 18px !important; /* Dibuat sedikit membulat, bukan lingkaran sempurna */
          background-color: var(--launcher-bg) !important;
          color: var(--launcher-text) !important;
          border: none !important;
          cursor: pointer !important;
          box-shadow: var(--launcher-shadow) !important;
          display: flex !important;
          justify-content: center !important;
          align-items: center !important;
          position: relative !important;
          z-index: 2 !important;
          transition: transform 0.3s ease, box-shadow 0.3s ease, border-radius 0.3s ease !important;
          outline: none !important;
          padding: 6px !important;
          overflow: visible !important;
        }

        /* Efek Hover Animasi Meluncur */
        #floating-launcher-container .launcher-toggle:hover {
          animation: rocketShake 0.15s infinite alternate, rocketThrust 1s infinite !important;
        }

        /* Gambar Ikon Custom Roket */
        #floating-launcher-container .launcher-toggle img.icon-custom {
          width: 100% !important;
          height: 100% !important;
          object-fit: contain !important; /* Agar gambar tidak terpotong sama sekali */
          border-radius: 12px !important;
          transition: transform var(--launcher-speed) ease, opacity var(--launcher-speed) ease !important;
          position: absolute !important;
        }

        /* Ikon Close (X) saat menu terbuka */
        #floating-launcher-container .launcher-toggle svg.icon-close {
          width: 28px !important;
          height: 28px !important;
          fill: none !important;
          stroke: var(--launcher-primary) !important;
          stroke-width: 2.5 !important;
          stroke-linecap: round !important;
          stroke-linejoin: round !important;
          transition: transform var(--launcher-speed) ease, opacity var(--launcher-speed) ease !important;
          position: absolute !important;
          opacity: 0 !important;
          transform: rotate(-180deg) scale(0.5) !important;
        }

        /* State Aktif (Menu Terbuka) */
        #floating-launcher-container.active .launcher-toggle {
          border-radius: 50% !important;
          animation: none !important;
        }

        #floating-launcher-container.active .icon-custom {
          opacity: 0 !important;
          transform: translateY(-20px) scale(0.3) !important; /* Efek roket terbang ke atas saat menu terbuka */
        }

        #floating-launcher-container.active .icon-close {
          opacity: 1 !important;
          transform: rotate(0deg) scale(1) !important;
        }

        /* Wrapper Menu Shortcut */
        #floating-launcher-container .launcher-menu {
          position: absolute !important;
          width: 0 !important;
          height: 0 !important;
          pointer-events: none !important;
        }

        #floating-launcher-container.active .launcher-menu {
          pointer-events: auto !important;
        }

        /* Tombol Shortcut Item */
        #floating-launcher-container .launcher-item {
          position: absolute !important;
          width: 50px !important;
          height: 50px !important;
          border-radius: 50% !important;
          background-color: var(--launcher-bg) !important;
          color: var(--launcher-primary) !important;
          display: flex !important;
          justify-content: center !important;
          align-items: center !important;
          text-decoration: none !important;
          box-shadow: var(--launcher-shadow) !important;
          opacity: 0 !important;
          transform: translate(0, 0) scale(0.3) !important;
          transition: transform var(--launcher-speed) var(--launcher-ease), opacity var(--launcher-speed) ease, box-shadow 0.2s ease !important;
          top: -25px !important;
          left: -25px !important;
        }

        #floating-launcher-container.active .launcher-item {
          opacity: 1 !important;
        }

        #floating-launcher-container .launcher-item:hover {
          transform: var(--target-transform) scale(1.15) !important;
          box-shadow: var(--launcher-shadow-hover) !important;
        }

        #floating-launcher-container .launcher-item img {
          width: 24px !important;
          height: 24px !important;
          object-fit: contain !important;
          border-radius: 4px !important;
        }

        #floating-launcher-container .launcher-item svg {
          width: 24px !important;
          height: 24px !important;
          fill: none !important;
          stroke: currentColor !important;
          stroke-width: 2 !important;
          stroke-linecap: round !important;
          stroke-linejoin: round !important;
        }

        /* Tooltip */
        #floating-launcher-container .launcher-item::after {
          content: attr(data-title);
          position: absolute !important;
          right: 60px !important;
          background-color: rgba(15, 23, 42, 0.85) !important;
          color: #ffffff !important;
          padding: 5px 10px !important;
          border-radius: 6px !important;
          font-size: 12px !important;
          font-weight: 500 !important;
          white-space: nowrap !important;
          opacity: 0 !important;
          visibility: hidden !important;
          pointer-events: none !important;
          transition: opacity 0.2s ease, transform 0.2s ease !important;
          transform: translateX(10px) !important;
          box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1) !important;
        }

        #floating-launcher-container .launcher-item:hover::after {
          opacity: 1 !important;
          visibility: visible !important;
          transform: translateX(0) !important;
        }

        /* Responsif Mobile */
        @media (max-width: 480px) {
          #floating-launcher-container {
            top: 65% !important;
            right: 15px !important;
          }
          #floating-launcher-container .launcher-toggle {
            width: 60px !important;
            height: 60px !important;
            border-radius: 14px !important;
          }
          #floating-launcher-container .launcher-item {
            width: 46px !important;
            height: 46px !important;
            top: -23px !important;
            left: -23px !important;
          }
        }
      `;
      document.head.appendChild(style);

      // 2. Injeksi Elemen HTML ke <body>
      const launcherContainer = document.createElement('div');
      launcherContainer.id = 'floating-launcher-container';
      launcherContainer.innerHTML = `
        <div class="launcher-menu" id="launcherMenu"></div>
        <button class="launcher-toggle" id="launcherToggle" aria-label="Buka Menu">
          <img src="https://apxid.github.io/kelas9i/assets/launcher.png" class="icon-custom" alt="Launcher Roket" />
          <svg class="icon-close" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      `;
      document.body.appendChild(launcherContainer);

      // 3. Logika JavaScript & Data Array
      window.launcherItems = [
        {
          title: "Kas Kelas 9I",
          icon: `<svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
          url: "https://apxid.github.io/kelas9i/kas/"
        },
        {
          title: "Google",
          icon: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8a4 4 0 1 0 4 4"/></svg>`,
          url: "https://google.com"
        },
        {
          title: "GitHub",
          icon: `<svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`,
          url: "https://github.com"
        },
        {
          title: "YouTube",
          icon: `<svg viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg>`,
          url: "https://youtube.com"
        }
      ];

      const toggleBtn = document.getElementById('launcherToggle');
      const menu = document.getElementById('launcherMenu');
      const radius = 130;
      const startAngle = 180;
      const endAngle = 270;

      window.renderLauncherItems = function() {
        menu.innerHTML = '';
        const totalItems = window.launcherItems.length;

        window.launcherItems.forEach((item, index) => {
          const anchor = document.createElement('a');
          anchor.className = 'launcher-item';
          anchor.href = item.url;
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          anchor.setAttribute('data-title', item.title);

          if (item.icon.startsWith('http') || item.icon.startsWith('data:image')) {
            anchor.innerHTML = `<img src="${item.icon}" alt="${item.title}" />`;
          } else {
            anchor.innerHTML = item.icon;
          }

          let angleDegree;
          if (totalItems === 1) {
            angleDegree = 225;
          } else {
            angleDegree = startAngle + (index * ((endAngle - startAngle) / (totalItems - 1)));
          }

          const angleRadian = angleDegree * (Math.PI / 180);
          const x = Math.round(radius * Math.cos(angleRadian));
          const y = Math.round(radius * Math.sin(angleRadian));

          const targetTransform = `translate(${x}px, ${y}px)`;
          anchor.style.setProperty('--target-transform', targetTransform);
          anchor.style.transitionDelay = `${index * 0.04}s`;

          menu.appendChild(anchor);
        });
      };

      window.renderLauncherItems();

      window.toggleLauncher = function() {
        const isActive = launcherContainer.classList.toggle('active');
        const items = menu.querySelectorAll('.launcher-item');

        items.forEach((item) => {
          if (isActive) {
            const targetTransform = item.style.getPropertyValue('--target-transform');
            item.style.transform = `${targetTransform} scale(1)`;
          } else {
            item.style.transform = 'translate(0, 0) scale(0.3)';
          }
        });
      };

      window.closeLauncher = function() {
        if (launcherContainer.classList.contains('active')) {
          window.toggleLauncher();
        }
      };

      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        window.toggleLauncher();
      });

      document.addEventListener('click', (e) => {
        if (!launcherContainer.contains(e.target)) {
          window.closeLauncher();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          window.closeLauncher();
        }
      });
    })();
  </script>
</body>
</html>
