<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Launcher Menu</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1e293b;
    }

    .demo-info {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- Konten Halaman Utama -->
  <div class="demo-info">
    <h2>Floating Launcher Menu</h2>
    <p>Klik tombol roket di sebelah kanan bawah untuk menampilkan shortcut link eksternal.</p>
  </div>

  <!-- Skrip Widget Floating Launcher -->
  <script>
    (function() {
      // 1. Injeksi CSS Widget ke dalam <head>
      const style = document.createElement('style');
      style.innerHTML = `
        :root {
          --launcher-primary: #2563eb;
          --launcher-bg: #ffffff;
          --launcher-text: #1e293b;
          --launcher-shadow: 0 10px 25px -5px rgba(0,0,0,0.15), 0 8px 10px -6px rgba(0,0,0,0.1);
          --launcher-shadow-hover: 0 20px 30px -5px rgba(37, 99, 235, 0.35), 0 8px 10px -6px rgba(0,0,0,0.1);
          --launcher-speed: 0.35s;
          --launcher-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Keyframes Animasi Getar Roket Bersiap Meluncur */
        @keyframes rocketShake {
          0% { transform: scale(1.05) translate(0, 0); }
          25% { transform: scale(1.05) translate(-1px, -2px); }
          50% { transform: scale(1.05) translate(2px, -1px); }
          75% { transform: scale(1.05) translate(-1px, 1px); }
          100% { transform: scale(1.05) translate(1px, -2px); }
        }

        @keyframes rocketThrust {
          0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5), 0 10px 25px -5px rgba(0,0,0,0.15); }
          50% { box-shadow: 0 12px 20px 6px rgba(249, 115, 22, 0.4), var(--launcher-shadow-hover); }
          100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5), 0 10px 25px -5px rgba(0,0,0,0.15); }
        }

        /* Container Utama Widget */
        #floating-launcher-container {
          position: fixed !important;
          top: 60% !important;
          right: 25px !important;
          transform: translateY(-50%) !important;
          z-index: 999999 !important;
          display: flex !important;
          justify-content: center !important;
          align-items: center !important;
          font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif !important;
        }

        /* Tombol Utama Trigger */
        #floating-launcher-container .launcher-toggle {
          width: 68px !important;
          height: 68px !important;
          border-radius: 18px !important;
          background-color: var(--launcher-bg) !important;
          color: var(--launcher-text) !important;
          border: none !important;
          cursor: pointer !important;
          box-shadow: var(--launcher-shadow) !important;
          display: flex !important;
          justify-content: center !important;
          align-items: center !important;
          position: relative !important;
          z-index: 10 !important;
          transition: transform 0.3s ease, box-shadow 0.3s ease, border-radius 0.3s ease !important;
          outline: none !important;
          padding: 6px !important;
        }

        /* Hover Animasi Sebelum Diklik */
        #floating-launcher-container .launcher-toggle:hover {
          animation: rocketShake 0.15s infinite alternate, rocketThrust 1s infinite !important;
        }

        /* Gambar Ikon Roket Custom */
        #floating-launcher-container .launcher-toggle img.icon-custom {
          width: 100% !important;
          height: 100% !important;
          object-fit: contain !important;
          border-radius: 12px !important;
          transition: transform var(--launcher-speed) var(--launcher-ease) !important;
          display: block !important;
          opacity: 1 !important; /* Dipastikan tetap terlihat */
        }

        /* State Aktif (Saat Menu Terbuka) */
        #floating-launcher-container.active .launcher-toggle {
          animation: none !important;
          box-shadow: var(--launcher-shadow-hover) !important;
          transform: scale(1.08) !important;
        }

        /* Efek Roket Meluncur Agak Ke Atas Saat Terbuka (Tidak Hilang) */
        #floating-launcher-container.active .icon-custom {
          transform: translateY(-4px) scale(1.1) !important;
        }

        /* Wrapper Menu Shortcut */
        #floating-launcher-container .launcher-menu {
          position: absolute !important;
          top: 50% !important;
          left: 50% !important;
          width: 0 !important;
          height: 0 !important;
          z-index: 5 !important;
        }

        /* Tombol Shortcut Link Eksternal */
        #floating-launcher-container .launcher-item {
          position: absolute !important;
          width: 50px !important;
          height: 50px !important;
          border-radius: 50% !important;
          background-color: var(--launcher-bg) !important;
          color: var(--launcher-primary) !important;
          display: flex !important;
          justify-content: center !important;
          align-items: center !important;
          text-decoration: none !important;
          box-shadow: var(--launcher-shadow) !important;
          opacity: 0 !important;
          pointer-events: none !important;
          transform: translate(-50%, -50%) scale(0.2) !important;
          transition: transform var(--launcher-speed) var(--launcher-ease), opacity 0.25s ease, box-shadow 0.2s ease !important;
        }

        /* Ketika Aktif, Link Muncul dan Bisa Diklik */
        #floating-launcher-container.active .launcher-item {
          opacity: 1 !important;
          pointer-events: auto !important;
          transform: var(--target-transform) scale(1) !important;
        }

        #floating-launcher-container .launcher-item:hover {
          transform: var(--target-transform) scale(1.18) !important;
          box-shadow: var(--launcher-shadow-hover) !important;
        }

        #floating-launcher-container .launcher-item img {
          width: 24px !important;
          height: 24px !important;
          object-fit: contain !important;
        }

        #floating-launcher-container .launcher-item svg {
          width: 24px !important;
          height: 24px !important;
          fill: none !important;
          stroke: currentColor !important;
          stroke-width: 2 !important;
          stroke-linecap: round !important;
          stroke-linejoin: round !important;
        }

        /* Tooltip Label */
        #floating-launcher-container .launcher-item::after {
          content: attr(data-title);
          position: absolute !important;
          right: 60px !important;
          background-color: rgba(15, 23, 42, 0.88) !important;
          color: #ffffff !important;
          padding: 6px 12px !important;
          border-radius: 6px !important;
          font-size: 12px !important;
          font-weight: 500 !important;
          white-space: nowrap !important;
          opacity: 0 !important;
          visibility: hidden !important;
          pointer-events: none !important;
          transition: opacity 0.2s ease, transform 0.2s ease !important;
          transform: translateX(8px) !important;
          box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1) !important;
        }

        #floating-launcher-container .launcher-item:hover::after {
          opacity: 1 !important;
          visibility: visible !important;
          transform: translateX(0) !important;
        }

        /* Adaptasi Layar Kecil / Mobile */
        @media (max-width: 480px) {
          #floating-launcher-container {
            top: 65% !important;
            right: 15px !important;
          }
          #floating-launcher-container .launcher-toggle {
            width: 60px !important;
            height: 60px !important;
            border-radius: 14px !important;
          }
          #floating-launcher-container .launcher-item {
            width: 46px !important;
            height: 46px !important;
          }
        }
      `;
      document.head.appendChild(style);

      // 2. Injeksi Elemen HTML
      const launcherContainer = document.createElement('div');
      launcherContainer.id = 'floating-launcher-container';
      launcherContainer.innerHTML = `
        <div class="launcher-menu" id="launcherMenu"></div>
        <button class="launcher-toggle" id="launcherToggle" aria-label="Buka Menu">
          <img src="https://apxid.github.io/kelas9i/assets/launcher.png" class="icon-custom" alt="Launcher Roket" />
        </button>
      `;
      document.body.appendChild(launcherContainer);

      // 3. Logika JavaScript & Data Link Eksternal
      window.launcherItems = [
        {
          title: "Kas Kelas 9I",
          icon: `<svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
          url: "https://apxid.github.io/kelas9i/kas/"
        },
        {
          title: "Google",
          icon: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8a4 4 0 1 0 4 4"/></svg>`,
          url: "https://google.com"
        },
        {
          title: "GitHub",
          icon: `<svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`,
          url: "https://github.com"
        },
        {
          title: "YouTube",
          icon: `<svg viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg>`,
          url: "https://youtube.com"
        }
      ];

      const toggleBtn = document.getElementById('launcherToggle');
      const menu = document.getElementById('launcherMenu');
      const radius = 120; // Jarak jangkar sebaran shortcut (px)
      const startAngle = 180; // Sudut awal (arah kiri)
      const endAngle = 270;   // Sudut akhir (arah atas)

      // Kalkulasi Posisi Item Berbentuk Busur
      window.renderLauncherItems = function() {
        menu.innerHTML = '';
        const totalItems = window.launcherItems.length;

        window.launcherItems.forEach((item, index) => {
          const anchor = document.createElement('a');
          anchor.className = 'launcher-item';
          anchor.href = item.url;
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          anchor.setAttribute('data-title', item.title);

          if (item.icon.startsWith('http') || item.icon.startsWith('data:image')) {
            anchor.innerHTML = `<img src="${item.icon}" alt="${item.title}" />`;
          } else {
            anchor.innerHTML = item.icon;
          }

          let angleDegree;
          if (totalItems === 1) {
            angleDegree = 225;
          } else {
            angleDegree = startAngle + (index * ((endAngle - startAngle) / (totalItems - 1)));
          }

          const angleRadian = angleDegree * (Math.PI / 180);
          const x = Math.round(radius * Math.cos(angleRadian));
          const y = Math.round(radius * Math.sin(angleRadian));

          // Menentukan posisi target transform dengan mengabaikan offset pusat
          const targetTransform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
          anchor.style.setProperty('--target-transform', targetTransform);
          anchor.style.transitionDelay = `${index * 0.05}s`;

          menu.appendChild(anchor);
        });
      };

      // Jalankan fungsi render
      window.renderLauncherItems();

      // Fungsi Toggle
      window.toggleLauncher = function() {
        launcherContainer.classList.toggle('active');
      };

      window.closeLauncher = function() {
        launcherContainer.classList.remove('active');
      };

      // Event Listeners
      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        window.toggleLauncher();
      });

      document.addEventListener('click', (e) => {
        if (!launcherContainer.contains(e.target)) {
          window.closeLauncher();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          window.closeLauncher();
        }
      });
    })();
  </script>
</body>
</html>
