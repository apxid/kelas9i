<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MyClass 9I - Dashboard</title>
  
  <!-- Konfigurasi PWA & Ikon -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B409C">
  <link rel="icon" type="image/png" href="https://apxid.github.io/kelas9i/assets/9i.png">
  <link rel="apple-touch-icon" href="https://apxid.github.io/kelas9i/assets/9i.png">

  <!-- Eksternal Styling & Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { smpprimary: '#0B409C', osisyellow: '#F4CE14', appbg: '#F3F4F6' }
        }
      }
    }
  </script>
  
  <style>
    .nav-item.active { color: #0B409C !important; }
    .nav-item.active i { transform: translateY(-1px); filter: drop-shadow(0 4px 6px rgba(11, 64, 156, 0.25)); }
    .fade-in { animation: slideUp 0.35s ease forwards; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .shimmer { background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%); background-size: 200% 100%; animation: load 1.5s infinite; }
    @keyframes load { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    
    /* Sembunyikan scrollbar bawaan browser pada navigasi tab internal */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 flex justify-center items-center min-h-screen font-sans antialiased">
